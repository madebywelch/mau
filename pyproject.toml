[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mau-cli"
version = "0.1.0"
description = "Multi-Agent Unit CLI — orchestrates a simulated engineering team using local Claude / Codex CLIs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Robert Welch", email = "robert@madebywelch.com" }]
license = { text = "Apache-2.0" }
dependencies = [
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mau = "mau_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mau_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/mau_cli/prompts" = "mau_cli/prompts"
"src/mau_cli/evolution_fixtures" = "mau_cli/evolution_fixtures"
